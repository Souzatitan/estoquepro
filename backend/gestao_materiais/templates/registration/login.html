
`
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EstoquePro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 42px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            font-size: 28px;
            font-weight: 800;
        }

        h1 {
            color: #0f172a;
            text-align: center;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .errorlist {
            list-style: none;
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .error-message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 28px;
            color: #94a3b8;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">E</div>

        <h1>EstoquePro</h1>
        <p class="subtitle">Acesse sua conta administrativa</p>

        {% if form.errors %}
            <div class="error-message">
                Usuário ou senha incorretos. Verifique seus dados e tente novamente.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label for="id_username">Usuário</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="id_password">Senha</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Entrar no sistema
            </button>
        </form>

        <div class="footer">
            EstoquePro · Sistema de Gestão de Estoque
        </div>

    </main>

</body>
</html>
```
